<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Weather App | Real-time Forecast</title>
    <meta name="description" content="A simple and responsive weather app to check real-time weather conditions in any city.">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <header>
        <h1>🌤 Ultimate Weather App</h1>
    </header>

    <main>
        <!-- Form para mo-trigger ang search inig pindot sa 'Enter' key -->
        <form class="search-box" id="searchForm">
            <label for="cityInput" class="sr-only">Enter city name</label>
            <input 
                type="text" 
                id="cityInput" 
                placeholder="Enter city..." 
                required 
                autocomplete="off"
            >
            <button type="submit" id="searchBtn">Search</button>
        </form>

        <!-- Weather Info Section -->
        <section id="weatherInfo" class="weather-box hidden" aria-live="polite">
            <h3 id="cityName"></h3>
            <div id="weatherIcon" class="icon-wrapper">
                <!-- Image icon (para sa JS src update) -->
                <img class="icon" id="iconImg" src="" alt="Weather icon">
            </div>
            <p id="temp"></p>
            <p id="desc"></p>
            <p id="humidity"></p>
        </section>

        <!-- Loading Spinner -->
        <div id="loading" class="loading-spinner hidden"></div>
        
        <!-- Error Message -->
        <p id="errorMsg" class="error-message hidden"></p>
    </main>
</div>

<script src="script.js"></script>
</body>
</html>
